<section class="sect-p bg-spring s-connect" id="s-connect">
  <div class="container">
    <div class="s-connect__body">
      <picture class="sect-bg">
        <img src="@img/connect-bg.jpg" alt="background">
      </picture>
      <div class="s-connect__block">
        <div class="s-connect__main-inside">
          <h2 class="s-title s-connect__title">Бесплатная консультация</h2>
          <div class="s-connect__adv">
            <div class="s-connect__adv-item">
              <img src="@img/connect-icon.png" alt="icon" class="item-icon" />
              <span>Ознакомитесь с планом строительства</span>
            </div>
            <div class="s-connect__adv-item">
              <img src="@img/connect-icon.png" alt="icon" class="item-icon" />
              <span>Покажем всю документацию по ЖК</span>
            </div>
          </div>
        </div>
      </div>
      <div class="s-connect__block _blur">
        <div class="s-connect__form-inside">
          <form action="#" class="s-connect__form">
            <div class="form-grid">
              <div class="form-control">
                <input placeholder="Имя" type="text" class="input" />
              </div>
              <div class="form-control">
                <input placeholder="Номер телефона" type="tel" class="input" />
              </div>
              <div class="form-control">
                <div class="check-wrap">
                  <span class="wpcf7-form-control-wrap" data-name="f_agreement">
                    <span class="wpcf7-form-control wpcf7-acceptance">
                      <span class="wpcf7-list-item">
                        <label>
                          <input
                            type="checkbox"
                            name="f_agreement"
                            value="1"
                            aria-invalid="false"
                          />
                          <span class="wpcf7-list-item-label">
                            <span>
                              Я соглашаюсь с
                              <a href="/personal-data" target="_blank">
                                Правилами обработки персональных данных
                              </a>
                            </span>
                          </span>
                        </label>
                      </span>
                    </span>
                  </span>
                </div>
              </div>
              <button type="submit" class="btn-s">Оставить заявку</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
